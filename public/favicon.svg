<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#2D1B18"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)"/>

  <!-- Subtle Outer Gold Border -->
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#gold-grad)" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Book Base Silhouette -->
  <g transform="translate(0, 15)">
    <!-- Left Page -->
    <path d="M 256 360 C 200 320 120 320 70 335 L 70 175 C 120 160 200 160 256 200 Z" fill="url(#gold-grad)" opacity="0.95"/>
    
    <!-- Right Page -->
    <path d="M 256 360 C 312 320 392 320 442 335 L 442 175 C 392 160 312 160 256 200 Z" fill="url(#gold-grad)" opacity="0.85"/>

    <!-- Spine Divider Line -->
    <path d="M 256 195 L 256 365" stroke="#2D1B18" stroke-width="8" stroke-linecap="round"/>

    <!-- Left Page Lines -->
    <path d="M 110 215 C 150 205 200 210 230 225 M 110 245 C 150 235 200 240 230 255 M 110 275 C 150 265 200 270 230 285" stroke="#4E342E" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

    <!-- Right Page Lines -->
    <path d="M 402 215 C 362 205 312 210 282 225 M 402 245 C 362 235 312 240 282 255 M 402 275 C 362 265 312 270 282 285" stroke="#4E342E" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

    <!-- Floating Heart Emblem -->
    <path d="M 256 180 C 256 180 210 130 175 160 C 145 185 170 225 256 280 C 342 225 367 185 337 160 C 302 130 256 180 256 180 Z" fill="#E74C3C" filter="url(#glow)"/>
    <path d="M 256 180 C 256 180 210 130 175 160 C 145 185 170 225 256 280 C 342 225 367 185 337 160 C 302 130 256 180 256 180 Z" stroke="url(#gold-grad)" stroke-width="4" fill="none"/>

    <!-- Ancestry Tree Roots -->
    <path d="M 256 365 L 256 410 M 256 390 Q 210 400 170 425 M 256 395 Q 302 405 342 425 M 256 410 Q 230 430 200 445 M 256 410 Q 282 430 312 445" stroke="url(#gold-grad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>
</svg>
